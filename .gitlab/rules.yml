## Job variables:
##   KWIVER_CI_RELEASE
##     Set to "true" for release-related jobs

# When to even consider running a pipeline
workflow:
  rules:
    # Run for merge requests
    - if: "$CI_MERGE_REQUEST_ID"
      when: always
      auto_cancel:
        on_new_commit: interruptible
    # If not MR, only run for main repo
    - if: '$CI_PROJECT_PATH != "kwiver/kwiver"'
      when: never
    # Run for protected branches
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: always
      auto_cancel:
        on_new_commit: interruptible
    # Run for tags
    - if: "$CI_COMMIT_TAG"
      when: always
    # Run for schedules
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
      auto_cancel:
        on_new_commit: none
    - when: never

.rules:
  rules:
    # Release jobs only run on tags
    - if: '$KWIVER_CI_RELEASE == "true" && $CI_COMMIT_TAG'
      when: on_success
    # Release jobs don't run otherwise
    - if: '$KWIVER_CI_RELEASE == "true"'
      when: never
    # Dev upload jobs only run on main branch (not MR, not tag)
    - if: '$KWIVER_CI_DEV_UPLOAD == "true" && $CI_COMMIT_BRANCH == "main" && $CI_MERGE_REQUEST_ID == null && $CI_COMMIT_TAG == null'
      when: on_success
    # Dev upload jobs don't run otherwise
    - if: '$KWIVER_CI_DEV_UPLOAD == "true"'
      when: never
    # MR jobs
    - if: "$CI_MERGE_REQUEST_ID"
      when: on_success
    # Normal jobs on the project run automatically.
    - when: on_success
