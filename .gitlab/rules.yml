## Job variables:
##   KWIVER_CI_UPLOAD
##     Set to "true" for PyPI upload jobs (handles both release and dev uploads)

# When to even consider running a pipeline
workflow:
  rules:
    # Run for merge requests
    - if: "$CI_MERGE_REQUEST_ID"
      when: always
      auto_cancel:
        on_new_commit: interruptible
    # If not MR, only run for main repo
    - if: '$CI_PROJECT_PATH != "kwiver/kwiver"'
      when: never
    # Run for schedules
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
      auto_cancel:
        on_new_commit: none
    # Run for protected branches
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: always
      auto_cancel:
        on_new_commit: interruptible
    # Run for tags
    - if: "$CI_COMMIT_TAG"
      when: always
    - when: never

.rules:
  rules:
    # Upload jobs run on protected refs when not in MR
    - if: '$KWIVER_CI_UPLOAD == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_MERGE_REQUEST_ID == null'
      when: on_success
    # Upload jobs don't run otherwise
    - if: '$KWIVER_CI_UPLOAD == "true"'
      when: never
    # MR jobs
    - if: "$CI_MERGE_REQUEST_ID"
      when: on_success
    # Normal jobs on the project run automatically.
    - when: on_success
