# Linux-specific builder configurations and build commands

## Base images

.linux:
    variables:
        GIT_CLONE_PATH: $CI_BUILDS_DIR/gitlab-kitware-sciviz-ci
        GIT_SUBMODULE_STRATEGY: none

.ubuntu2204:
    extends: .linux
    image: "kitware/kwiver:ci-ubuntu22_04-20251209"

.ubuntu2204_arrows:
    extends:
        - .ubuntu2204

    variables:
        CMAKE_CONFIGURATION: ubuntu2204_ceres_dbow2_ffmpeg_gdal_kpf_opencv_pdal_proj_python_qt_uuid_vtk_vxl

.manylinux2014_x86_64:
    extends: .linux
    image: "kitware/kwiver:ci-python-20251211"

.linux_builder_tags:
    tags:
        - build
        - docker
        - linux-x86_64
        - kwiver

# testing cuda requires cuda-capable runner
.linux_tester_tags:
    tags:
        - docker
        - linux-x86_64
        - cuda-rt
        - kwiver

## Linux-specific scripts


.cmake_build_linux:
    stage: build
    extends: .warning_policy

    script:
        - .gitlab/ci/build_linux.sh

    interruptible: true


.cmake_test_linux:
    stage: test

    script:
        - .gitlab/ci/test_linux.sh

    interruptible: true
